<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7A0C1B">
<title>Màn Hình Chiếu - Điểm Danh</title>
<!-- SỬA: thêm font Tinos — khớp với index.html (xem comment chi tiết ở đó). Màn
     hình chiếu thật thường chạy trên Android TV box, vốn KHÔNG có sẵn font
     'Times New Roman' như Windows nơi admin soạn/xem preview, nên trước đây
     trình duyệt tự thay bằng 1 font serif khác có độ rộng ký tự khác, làm banner
     xuống dòng SAI VỊ TRÍ so với preview dù nội dung/cỡ chữ giống hệt. Tinos là
     web font tải qua CDN, hỗ trợ đầy đủ dấu tiếng Việt, metric-compatible với
     Times New Roman — mọi thiết bị giờ render cùng 1 file font thật sự. -->
<!-- Arimo + Roboto: khớp ĐÚNG với index.html (xem comment ở đó) — bannerHtml
     lưu sẵn có thể chứa font-family trỏ tới bất kỳ lựa chọn nào trong dropdown
     "Font chữ" của Admin, nên display.html phải tải đủ cùng bộ font đó. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Arimo:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <!-- config.js PHAI nap TRUOC dong duoi va truoc script chinh -->
    <script src="config.js"></script>
<script src="profanity-filter.js"></script>
<!--
    ============================================================
    MÀN HÌNH CHIẾU (display.html) — dùng để chiếu lên LED/máy chiếu
    song song với việc điểm danh qua index.html.

    CÁCH DÙNG:
    - Mở file này với ?id=<MEETING_ID> trong URL, ví dụ:
      .../display.html?id=ABC123
    - Lấy link này bằng cách: vào trang Admin (index.html?mode=admin),
      sau khi lưu cấu hình cuộc họp sẽ có nút "🖥️ Mở Màn Hình Chiếu".
    - Cấu hình ảnh trống đồng + nội dung banner ngay trong trang Admin
      (mục "URL ảnh trống đồng" và "Nội dung Banner Hội Nghị").

    CẤU TRÚC LAYER (từ dưới lên trên):
    - Layer 1: nền đỏ (gradient cố định trong code)
    - Layer 2: ảnh trống đồng xoay chậm giữa màn hình (URL từ config)
    - Layer 3: khung viền cách mép màn hình
    - Layer 4: banner hội nghị (nội dung từ config, căn giữa khung)
    - Thanh dưới cùng: dashboard đơn vị (trái) | banner tên chạy
      marquee (giữa) | thông báo tên vừa điểm danh (phải)
    ============================================================
-->
<style>
    :root {
        --ink: #FFF8F0;
        --ink-soft: rgba(255,248,240,0.78);
        --muted: rgba(255,248,240,0.5);
        --gold: #FFC828;
        --gold-soft: rgba(255,200,40,0.35);
        --success: #34D399;
        --surface: rgba(20, 4, 6, 0.55);
        --line: rgba(232,196,104,0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #4A0510;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink);
    }

    /* ============ LAYER 1: NỀN ĐỎ ============ */
    /* Mặc định: gradient CSS. Nếu admin dán URL ảnh nền (displayBackgroundUrl),
       JS sẽ thêm class .has-image và set background-image thay cho gradient. */
    #layerRed {
        position: fixed;
        inset: 0;
        z-index: 1;
        background:
            radial-gradient(1400px 900px at 50% 35%, #A3121F 0%, #7A0C1B 55%, #4A0510 100%);
        background-size: cover;
        background-position: center;
    }

    /* ============ LAYER 2: TRỐNG ĐỒNG XOAY ============ */
    #layerDrum {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        pointer-events: none;
    }
    #drumImg {
        width: 100vw;
        height: 100vw;
        max-width: none;
        max-height: none;
        object-fit: contain;
        opacity: 0.22;
        animation: spinDrum 60s linear infinite;
        filter: drop-shadow(0 0 60px rgba(232,196,104,0.15));
    }
    @keyframes spinDrum {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
    }

    /* ============ LAYER 3: KHUNG VIỀN ============ */
    /* Model VECTOR THUẦN: 4 góc hoa văn được TRACE lại chính xác từ file
       ảnh mẫu "khung-vien-trang-tri.png" thành SVG <path> (không còn dùng
       ảnh PNG nữa) + 4 đường line CSS nối liền. Vì góc và line giờ dùng
       CHUNG một giá trị fill/background duy nhất (var(--gold)), và path
       góc được đo & cắt chính xác đúng bằng --frame-corner-size (190px ở
       độ phân giải chuẩn) nên line luôn chạm khớp đúng điểm hoa văn kết
       thúc — hết hẳn tình trạng "hở góc" hay "lệch màu" của model ảnh PNG
       cũ (ảnh PNG có viền trong suốt thừa không đều, không thể co giãn
       chính xác bằng CSS).
       4 góc TR/BL/BR dùng CHUNG 1 <symbol> (chỉ vẽ 1 lần cho góc TL) rồi
       lật bằng CSS transform scaleX(-1)/scaleY(-1) — đúng nguyên tắc đối
       xứng hình học của hoa văn góc (matching cách 4 ảnh PNG gốc từng
       được vẽ riêng nhưng đối xứng nhau qua trục ngang/dọc/cả hai).

       KHUNG VIỀN TỰ NÂNG LÊN NÉ THANH DƯỚI: khác với banner nội dung
       (#layerBanner, đứng yên tuyệt đối — xem layer 4 bên dưới), khung
       viền trang trí phải tự thu hẹp "bottom" lên đúng bằng chiều cao
       thanh dưới đang hiện (--bottom-bar-height) mỗi khi bottomBar có
       class .live, để cạnh dưới + 2 góc dưới không bao giờ bị bar che
       mất — JS chỉ cần toggle 1 class .frame-avoid-bar lên #layerFrame
       cùng lúc với .live trên #bottomBar (xem hàm showBottomBar/
       hideBottomBar bên dưới), CSS transition tự lo phần nội suy mượt. */
    :root {
        --frame-margin: 24px;
        /* Kích thước góc: co theo bề rộng màn hình, giữ tỉ lệ hợp lý trên
           mọi kích thước LED/máy chiếu (Full HD → 4K), khớp đúng tỉ lệ
           190/2500 ≈ 7.6% bề rộng khung mẫu gốc mà path đã được đo theo. */
        --frame-corner-size: clamp(64px, 7vw, 190px);
        --frame-line-thickness: 3px;
    }
    #layerFrame {
        position: fixed;
        top: var(--frame-margin);
        left: var(--frame-margin);
        right: var(--frame-margin);
        bottom: var(--frame-margin);
        z-index: 3;
        pointer-events: none;
        transition: bottom 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Khi thanh dưới trồi lên (.live), khung viền tự nâng "bottom" lên
       đúng bằng chiều cao sống của bar — line dưới + 2 góc dưới di
       chuyển lên theo, không còn bị bar đè/che mất nữa. */
    #layerFrame.frame-avoid-bar {
        bottom: calc(var(--frame-margin) + var(--bottom-bar-height, 92px));
    }
    .frame-corner {
        position: absolute;
        width: var(--frame-corner-size);
        height: var(--frame-corner-size);
        display: block;
        fill: var(--gold);
    }
    #frameCornerTL { top: 0; left: 0; }
    /* TR/BL/BR: lật lại đúng bằng CSS transform từ CHUNG 1 hình vẽ góc
       TL — hoa văn đối xứng hình học chuẩn xác qua trục ngang/dọc/cả hai,
       không cần vẽ/trace riêng từng góc. */
    #frameCornerTR { top: 0; right: 0; transform: scaleX(-1); }
    #frameCornerBL { bottom: 0; left: 0; transform: scaleY(-1); }
    #frameCornerBR { bottom: 0; right: 0; transform: scale(-1, -1); }
    .frame-line {
        position: absolute;
        background: var(--gold);
        opacity: 0.9;
    }
    #frameLineTop, #frameLineBottom {
        left: var(--frame-corner-size);
        right: var(--frame-corner-size);
        height: var(--frame-line-thickness);
    }
    #frameLineTop { top: 0; }
    #frameLineBottom { bottom: 0; }
    #frameLineLeft, #frameLineRight {
        top: var(--frame-corner-size);
        bottom: var(--frame-corner-size);
        width: var(--frame-line-thickness);
    }
    #frameLineLeft { left: 0; }
    #frameLineRight { right: 0; }

    /* ============ LAYER 4: BANNER HỘI NGHỊ ============ */
    /* Banner giờ CỐ ĐỊNH theo toàn bộ màn hình (top/left/right/bottom: 0),
       KHÔNG co theo --bottom-bar-live nữa. Nhờ vậy #bannerContent (neo TOP
       bằng justify-content:flex-start, xem chi tiết bên dưới) luôn tính vị
       trí trên ĐÚNG MỘT vùng cố định duy nhất — dòng "Trị An, ngày...tháng...
       năm..." và toàn bộ nội dung không bao giờ bị dịch chuyển vị trí khi
       bar hiện/ẩn.
       Để dòng cuối không bị thanh dưới (khi trồi lên) đè lên, ta chừa sẵn
       1 khoảng đệm dưới cố định bằng đúng chiều cao "sống" tối đa của bar
       (--bottom-bar-height, ví dụ 92px) thay vì biến động theo trạng thái
       hiện/ẩn — padding-bottom này KHÔNG đổi theo bar, nên nội dung giữ
       nguyên vị trí như anh yêu cầu. */
    #layerBanner {
        position: fixed;
        inset: 0;
        z-index: 4;
        overflow: hidden;
    }
    #bannerContent {
        /* Nội dung banner được soạn trong Admin theo 1 khung THAM CHIẾU cố
           định 1920×1080 (đúng nền cỡ chữ px mà dropdown "Cỡ chữ", "Dòng"...
           dùng, và đúng con số 1920 mà bản xem trước admin dùng để tính tỉ
           lệ khung: scale = frame.offsetWidth / 1920). Ở đây ta dựng
           #bannerContent với kích thước THẬT 1920×1080px rồi scale nguyên
           khối theo đúng tỉ lệ màn hình chiếu thật/1920 bằng transform —
           nhờ vậy 1 khối chữ 32px luôn chiếm ĐÚNG MỘT TỈ LỆ % giống hệt
           nhau dù soạn trên khung preview nhỏ hay chiếu trên màn hình LED/
           máy chiếu lớn, khớp 1:1 với bản xem trước trong Admin — không
           còn tình trạng "chữ tràn khung trong preview nhưng bé xíu khi
           chiếu thật" do trước đây px được áp dụng tuyệt đối, không theo
           tỉ lệ màn hình. */
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1920px;
        height: 1080px;
        transform: translate(-50%, -50%) scale(var(--banner-fit-scale, 1));
        transform-origin: center center;
        box-sizing: border-box;
        padding: 4%;
        /* Đệm dưới CỐ ĐỊNH bằng đúng chiều cao tối đa của thanh dưới cùng 
           (--bottom-bar-height, xem khối THANH DƯỚI), CHỨ KHÔNG dùng
           --bottom-bar-live (biến động theo hiện/ẩn). Nhờ vậy vùng nội dung
           luôn có 1 kích thước cố định duy nhất để tính vị trí — nội dung
           banner, kể cả dòng "Trị An, ngày...tháng...năm" ở cuối, đứng yên
           một chỗ bất kể bar đang trồi lên hay ẩn xuống, và không bao giờ
           bị bar đè lên vì đã có đủ khoảng trống chừa sẵn.
           Giá trị --bottom-bar-height (92px) cũng được tính trên khung
           chuẩn 1920px nên tự động scale đúng theo cùng phép transform ở
           trên, không cần quy đổi riêng. */
        padding-bottom: calc(4% + var(--bottom-bar-height, 92px));
        display: flex;
        flex-direction: column;
        /* Neo TOP (không phải center-toàn-khối) — khớp đúng #bannerEditor bên
           Admin, xem giải thích chi tiết ở đó. Dòng ngày tháng
           (data-date-line) canh ngang riêng, tách khỏi luồng center này. */
        justify-content: flex-start;
        align-items: center;
        text-align: center;
        color: #FFF8F0;
        /* SỬA: 'Tinos' trước — khớp CHÍNH XÁC font-family của #bannerEditor bên
           index.html, xem comment ở đó. */
        font-family: 'Tinos', 'Times New Roman', Georgia, serif;
        text-shadow: 0 2px 18px rgba(0,0,0,0.55);
        overflow: hidden;
        /* Nội dung là HTML soạn sẵn từ RTE trong Admin (bannerHtml), gán trực
           tiếp bằng innerHTML — không còn model textbox định vị theo % riêng
           từng ô như trước. */
    }
    #bannerContent [data-date-line] {
        margin-top: 18px;
    }
    #bannerContent table {
        border-collapse: collapse;
        margin: 8px auto;
    }
    #bannerContent table td, #bannerContent table th {
        border: 1px solid rgba(255,248,240,0.5);
        padding: 6px 10px;
    }
    #bannerContent img { max-width: 100%; }


    /* ============ (đã bỏ ô tên cuộc họp góc trên trái) ============ */

    #connError {
        position: fixed;
        top: 46px;
        right: 46px;
        z-index: 10;
        background: rgba(248,113,113,0.16);
        border: 1px solid rgba(248,113,113,0.4);
        color: #FCA5A5;
        border-radius: 10px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 600;
        display: none;
    }
    #connError.show { display: block; }

    /* ============ THANH DƯỚI CÙNG: 3 VÙNG (1/5 - 3/5 - 1/5) ============ */
    /* TỰ ẨN/HIỆN: nếu 10s không có điểm danh mới, bar trượt xuống, chỉ
       chừa lại --bottom-bar-peek (mép nhỏ) để người xem biết vẫn còn
       thanh ở đó. Có điểm danh mới → bar trồi lên ngay (class .live). JS
       điều khiển việc thêm/bỏ class .live, xem hàm scheduleBarAutoHide(). */
    :root {
        --bottom-bar-height: 92px;
        --bottom-bar-peek: 10px;
    }
    #bottomBar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--bottom-bar-height);
        z-index: 20;
        display: flex;
        align-items: stretch;
        background: rgba(10, 2, 4, 0.72);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        backdrop-filter: blur(20px) saturate(140%);
        border-top: 1px solid var(--line);
        /* Mặc định (chưa có điểm danh nào / đã quá 10s im ắng): ẩn xuống,
           chỉ lộ mép --bottom-bar-peek phía trên mép màn hình. */
        transform: translateY(calc(var(--bottom-bar-height) - var(--bottom-bar-peek)));
        transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #bottomBar.live {
        transform: translateY(0);
    }

    /* --- Vùng trái: Dashboard đơn vị — DẠNG CUỘN DỌC TỰ ĐỘNG -----
       Thiết kế lại vì số đơn vị thực tế có thể lên tới hơn 100 (xem
       UNIT_LIST trong Ma.gs) — một danh sách tĩnh top-5 không đủ chỗ
       và luôn bị khuất. Thay bằng băng cuộn dọc chạy liên tục, hiển
       thị lần lượt TẤT CẢ đơn vị đã có người điểm danh, không giới
       hạn số dòng. Vùng cũng được nới rộng hơn (28% thay vì 20%) vì
       cần chỗ cho tên đơn vị dài. */
    #dashZone {
        flex: 0 0 20%;
        max-width: 20%;
        display: flex;
        align-items: stretch;
        gap: 14px;
        padding: 10px 16px;
        border-right: 1px solid rgba(232,196,104,0.22);
        overflow: hidden;
    }
    #dashZone .total-badge {
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding-right: 14px;
        border-right: 1px solid rgba(232,196,104,0.18);
    }
    #dashZone .total-badge .num {
        font-size: 28px;
        font-weight: 900;
        color: var(--gold);
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }
    #dashZone .total-badge .lbl {
        font-size: 9px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 700;
        margin-top: 4px;
        white-space: nowrap;
    }
    #dashZone .total-badge .unit-count-lbl {
        font-size: 9.5px;
        color: var(--ink-soft);
        margin-top: 8px;
        white-space: nowrap;
        font-weight: 600;
    }
    #dashUnitsWrap {
        flex: 1 1 auto;
        min-width: 0;
        position: relative;
        overflow: hidden;
        /* mờ dần ở mép trên/dưới để chữ trôi vào/ra mượt hơn thay vì
           bị cắt cứng */
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    }
    #dashUnitsTrack {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 12.5px;
        line-height: 1.4;
        will-change: transform;
        animation: dashScrollUp linear infinite;
    }
    #dashUnitsTrack.paused { animation-play-state: paused; }
    @keyframes dashScrollUp {
        from { transform: translateY(0); }
        to { transform: translateY(-50%); } /* nội dung được nhân đôi -> cuộn nửa track là 1 vòng */
    }
    #dashUnitsTrack .unit-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        color: var(--ink-soft);
        white-space: nowrap;
        padding: 2px 0;
    }
    #dashUnitsTrack .unit-row .u-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
    }
    #dashUnitsTrack .unit-row .u-count {
        flex: none;
        font-weight: 800;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
    }

    /* --- Vùng giữa: Banner tên chạy marquee (xác nhận điểm danh) ---
       THIẾT KẾ MỚI: mỗi tên chỉ chạy MỘT LƯỢT từ phải sang trái rồi
       biến mất (không lặp vô hạn như trước — tên đầu không còn bị
       lặp lại ngay, và tốc độ đọc cố định, không dồn lại khi đông
       người vì mỗi tên đi riêng, xếp hàng chờ tới lượt). */
    #marqueeZone {
        flex: 1 1 60%;
        max-width: 60%;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
    }
    #marqueeTrack {
        position: relative;
        width: 100%;
        height: 100%;
    }
    .marquee-item {
        position: absolute;
        top: 50%;
        left: 100%;
        display: inline-flex;
        align-items: baseline;
        gap: 10px;
        padding: 0 24px;
        font-size: 22px;
        font-weight: 800;
        color: var(--ink);
        white-space: nowrap;
        will-change: transform;
        animation: marqueeOnePass linear forwards;
        z-index: 2;
    }
    /* Tên chạy hết chiều rộng khung rồi biến mất hẳn bên trái, không
       quay vòng lại — dùng translateX theo % của chính item nên độ
       dài tên khác nhau vẫn chạy mượt cùng 1 công thức. */
    @keyframes marqueeOnePass {
        from { transform: translate(0, -50%); }
        to   { transform: translate(-100vw, -50%); }
    }
    .marquee-item .m-meta {
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-soft);
    }
    #marqueeEmpty {
        position: absolute;
        left: 0;

<script>
    // ============ SCALE BANNER THEO ĐÚNG TỈ LỆ MÀN HÌNH THẬT ============
    // #bannerContent được dựng ở kích thước THẬT 1920×1080 (khung tham chiếu
    // chuẩn — xem comment CSS #bannerContent) rồi co lại đúng bằng tỉ lệ
    // min(chiều_rộng_viewport/1920, chiều_cao_viewport/1080), giống hệt
    // cách bản xem trước trong Admin tính (frame.offsetWidth / 1920) — nhờ
    // vậy 1 đoạn chữ cỡ 32px luôn chiếm đúng cùng 1 tỉ lệ % dù màn hình to
    // hay nhỏ, khớp preview 1:1. Dùng JS + CSS custom property thay vì
    // calc()/min() lồng nhau trực tiếp trong "transform: scale()" — cú
    // pháp đó không hợp lệ (scale() cần số thuần, calc(vw/px) bên trong
    // min() không được trình duyệt tính đúng), khiến toàn bộ transform bị
    // trình duyệt bỏ qua và banner bị đẩy lệch hẳn ra ngoài khung nhìn.
    function updateBannerFitScale() {
        const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        document.documentElement.style.setProperty('--banner-fit-scale', s);
    }
    updateBannerFitScale();
    window.addEventListener('resize', updateBannerFitScale);

    // ============================================================
    // Giờ đọc từ config.js (nạp bằng <script src="config.js"> ở <head>,
    // TRƯỚC file này) — dùng chung 1 nơi cấu hình cho cả index.html,
    // display.html, checkin-rollcall.html. Khi đổi tài khoản Google, chỉ
    // sửa config.js, KHÔNG cần sửa dòng nào ở đây.
    // ============================================================
    if (typeof GOOGLE_APPS_SCRIPT_URL === 'undefined') {
        console.error('❌ Không tìm thấy config.js — kiểm tra lại thẻ <script src="config.js"> trong <head>, phải đặt TRƯỚC thẻ <script> chứa đoạn code này.');
    }

    // Tối ưu tốc độ đồng bộ giữa điện thoại (index.html) và màn hình chiếu:
    // trước đây poll cố định mỗi 6s nên có lúc người dùng đã thấy "Điểm danh
    // thành công!" trên điện thoại nhưng phải chờ tới 6s tên mới xuất hiện
    // trên LED — cảm giác "không đồng bộ". Nay dùng NHỊP POLL THÍCH ỨNG:
    // - Bình thường: mỗi 3s (nhanh gấp đôi, đủ nhẹ cho Apps Script/Sheets).
    // - Sau khi vừa phát hiện có điểm danh mới: chuyển sang "dồn dập" mỗi 1.5s
    //   trong FAST_POLL_WINDOW_MS kế tiếp, để bắt kịp các lượt điểm danh liên
    //   tiếp (nhiều người bấm gửi gần như cùng lúc) mà không phải đợi hết cả
    //   chu kỳ chậm — sau đó tự trở lại nhịp bình thường nếu không có gì mới.
    const POLL_INTERVAL_MS = 3000;
    const FAST_POLL_INTERVAL_MS = 1500;
    const FAST_POLL_WINDOW_MS = 12000;
    const TOAST_DURATION_MS = 5000;

    const params = new URLSearchParams(window.location.search);
    const meetingID = params.get('id') || params.get('meetingID') || '';

    let jsonpCounter = 0;
    function callGASJsonp(payload, timeoutMs = 10000) {
        return new Promise((resolve, reject) => {
            jsonpCounter++;
            const callbackName = 'displayJsonp_' + Date.now() + '_' + jsonpCounter;
            const script = document.createElement('script');
            let settled = false;

            const cleanup = () => {
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
                clearTimeout(timer);
            };

            const timer = setTimeout(() => {
                if (settled) return;
                settled = true;
                cleanup();
                reject(new Error('timeout'));
            }, timeoutMs);

            window[callbackName] = (data) => {
                if (settled) return;
                settled = true;
                cleanup();
                resolve(data);
            };

            script.onerror = () => {
                if (settled) return;
                settled = true;
                cleanup();
                reject(new Error('script load error'));
            };

            const p = new URLSearchParams();
            Object.keys(payload).forEach(k => p.set(k, payload[k]));
            p.set('callback', callbackName);
            script.src = GOOGLE_APPS_SCRIPT_URL + '?' + p.toString();
            document.body.appendChild(script);
        });
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // Lớp phòng hộ thứ 2: index.html đã chặn không cho gửi tên phản
    // cảm, nhưng dữ liệu cũ trong Sheet (nhập trước khi có bộ lọc,
    // hoặc sửa tay trực tiếp trong Sheet) vẫn có thể lọt qua đây —
    // che lại trước khi đưa lên LED.
    function sanitizePerson(p) {
        if (!window.ProfanityFilter) return p;
        return {
            ...p,
            fullName: ProfanityFilter.maskIfBlocked(p.fullName),
            position: ProfanityFilter.check(p.position || '').blocked ? '' : p.position,
            department: ProfanityFilter.check(p.department || '').blocked ? '' : p.department
        };
    }

    // ============ LAYER 2: ẢNH TRỐNG ĐỒNG ============
    function applyDrumImage(url) {
        const img = document.getElementById('drumImg');
        if (url && String(url).trim()) {
            img.src = String(url).trim();
            img.style.display = 'block';
        }
    }

    // ============ LAYER 1: ẢNH NỀN ĐỎ (thay cho gradient mặc định) ============
    function applyBackgroundImage(url, opacity) {
        const layer = document.getElementById('layerRed');
        if (url && String(url).trim()) {
            layer.style.backgroundImage = `url('${String(url).trim()}')`;
            layer.classList.add('has-image');
        }
        // opacity: 0-100 (%) — độ hiện rõ của ảnh nền; phần còn lại vẫn thấy
        // gradient đỏ bên dưới lộ ra qua độ mờ, tránh nền quá rực/chói.
        if (opacity !== undefined && opacity !== null && opacity !== '') {
            const v = Math.max(0, Math.min(100, Number(opacity)));
            layer.style.opacity = String(v / 100);
        }
    }

    // ============ LỀ KHUNG VIỀN (áp dụng cho cả 2 mode: CSS border và ảnh) ============
    // Mặc định 24px (khớp với --frame-margin trong CSS :root và giá trị mặc
    // định của slider "Lề khung viền" bên Admin) để khung viền không ôm sát
    // tuyệt đối vào mép màn hình — chừa 1 khoảng hở vừa phải, dễ nhìn hơn
    // trên màn LED/máy chiếu lớn. Config cũ chưa từng lưu field này (undefined)
    // vẫn tự rơi về đúng mặc định 24px thay vì bị hiểu nhầm thành 0px.
    function applyFrameMargin(marginPx) {
        const v = (marginPx === undefined || marginPx === null || marginPx === '')
            ? 24
            : Math.max(0, Number(marginPx));
        document.documentElement.style.setProperty('--frame-margin', v + 'px');
    }

    // ============ VÁ FONT CHO BANNER ĐÃ LƯU TỪ TRƯỚC (legacy) ============
    // Trước khi có Tinos/Arimo, dropdown "Font chữ" bên Admin ghi thẳng tên font
    // HỆ THỐNG ('Times New Roman', Arial, Roboto, Georgia) vào bannerHtml đã lưu
    // — các cuộc họp đã cấu hình từ trước vẫn còn nguyên các tên font đó trong
    // dữ liệu cũ. Thay vì bắt admin soạn lại từ đầu, hàm này thay thế đúng các
    // tên font hệ thống đó bằng cùng font-family stack mới (web font đứng
    // trước) mỗi khi render — chuẩn hoá "trong suốt", không đổi nội dung/định
    // dạng nào khác của banner.
    function normalizeLegacyBannerFonts(html) {
        if (!html) return html;
        return html
            .replace(/font-family\s*:\s*(['"]?)Times New Roman\1\s*,\s*serif/gi, "font-family:'Tinos','Times New Roman',serif")
            .replace(/font-family\s*:\s*Georgia\s*,\s*serif/gi, "font-family:'Tinos',Georgia,serif")
            .replace(/font-family\s*:\s*Arial\s*,\s*sans-serif/gi, "font-family:'Arimo',Arial,sans-serif")
            .replace(/font-family\s*:\s*Roboto\s*,\s*sans-serif/gi, "font-family:'Roboto',sans-serif")
            .replace(/<font\s+face="(['"]?)Times New Roman\1,\s*serif"/gi, '<font face="\'Tinos\', \'Times New Roman\', serif"')
            .replace(/<font\s+face="Georgia,\s*serif"/gi, '<font face="\'Tinos\', Georgia, serif"')
            .replace(/<font\s+face="Arial,\s*sans-serif"/gi, '<font face="\'Arimo\', Arial, sans-serif"')
            .replace(/<font\s+face="Roboto,\s*sans-serif"/gi, '<font face="\'Roboto\', sans-serif"');
    }

    // ============ LAYER 4: BANNER HỘI NGHỊ ============
    // Nội dung banner giờ là 1 chuỗi HTML soạn sẵn từ Rich Text Editor bên
    // Admin (bannerHtml) — gán trực tiếp bằng innerHTML, hiển thị y hệt những
    // gì admin đã soạn (font, cỡ chữ, màu, căn lề, danh sách, bảng, ảnh...).
    // Admin tự soạn nội dung của chính họ nên chấp nhận innerHTML trực tiếp
    // (không có input từ người ngoài/người tham dự đi vào đường này).
    function renderBanner(bannerHtml) {
        const wrap = document.getElementById('bannerContent');
        wrap.innerHTML = normalizeLegacyBannerFonts((bannerHtml || '').trim());
    }

    // Tương thích ngược: cấu hình cũ (trước khi có RTE) lưu theo mảng textbox
    // (bannerBoxes, vị trí % + style riêng) — quy đổi tạm sang HTML tương
    // đương để vẫn hiển thị được, không bắt buộc admin phải soạn lại ngay.
    function renderBannerBoxesLegacy(boxes) {
        const wrap = document.getElementById('bannerContent');
        if (!boxes || !boxes.length) {
            wrap.innerHTML = '';
            return;
        }
        wrap.innerHTML = boxes.map(box => {
            const text = (box.text || '').trim();
            if (!text) return '';
            const style = [
                `font-size:${box.fontSize || 32}px`,
                `line-height:${box.lineHeight || 1.3}`,
                `text-align:${box.align || 'center'}`,
                `font-weight:${box.bold ? 900 : 700}`,
                box.color ? `color:${box.color}` : ''
            ].filter(Boolean).join(';');
            return `<div style="${style}">${escapeHtml(text).replace(/\n/g, '<br>')}</div>`;
        }).join('');
    }

    // ============ ÁP DỤNG CONFIG (ảnh nền, banner, khung viền...) ============
    // originalBannerCfg: nhớ lại banner GỐC (bannerHtml/bannerBoxes) của cuộc
    // họp, để khi Flash Roll-Call kết thúc có thể khôi phục lại đúng nội dung
    // cũ mà không cần gọi lại server.
    let originalBannerCfg = null;

    function applyMeetingMeta(cfg) {
        if (cfg.displayTrongDongUrl) {
            applyDrumImage(cfg.displayTrongDongUrl);
        }
        if (cfg.displayBackgroundUrl || cfg.backgroundOpacity !== undefined) {
            applyBackgroundImage(cfg.displayBackgroundUrl, cfg.backgroundOpacity);
        }
        applyFrameMargin(cfg.frameMargin);
        originalBannerCfg = { bannerHtml: cfg.bannerHtml || '', bannerBoxes: cfg.bannerBoxes || null };
        renderOriginalBanner();

        // Nếu cuộc họp đang có sẵn 1 đợt Flash Roll-Call còn hiệu lực (VD màn
        // hình LED vừa bị F5 giữa lúc đang đếm ngược), hiện lại banner lần 2
        // ngay lập tức thay vì đợi tới vòng poll kế tiếp mới nhận ra.
        applyRollCallFromConfig(cfg.rollCall);
    }

    function renderOriginalBanner() {
        if (!originalBannerCfg) return;
        if (typeof originalBannerCfg.bannerHtml === 'string' && originalBannerCfg.bannerHtml.trim()) {
            renderBanner(originalBannerCfg.bannerHtml);
        } else if (originalBannerCfg.bannerBoxes && originalBannerCfg.bannerBoxes.length) {
            renderBannerBoxesLegacy(originalBannerCfg.bannerBoxes);
        } else {
            renderBanner('');
        }
    }

    function loadMeetingConfig() {
        if (!meetingID) return;
        // Ưu tiên localStorage nếu đang mở trên cùng máy vừa cấu hình (nhanh,
        // không cần chờ mạng). Nếu không có/không khớp — VD màn hình LED dùng
        // trình duyệt/máy khác với máy admin — tra trực tiếp từ server bằng
        // chính meetingID (action getMeetingConfigByID, không cần mã ngắn).
        try {
            const saved = localStorage.getItem('meetingConfig');
            if (saved) {
                const cfg = JSON.parse(saved);
                if (cfg.meetingID === meetingID) {
                    applyMeetingMeta(cfg);
                    return;
                }
            }
        } catch (e) { /* ignore */ }

        callGASJsonp({ action: 'getMeetingConfigByID', meetingID: meetingID })
            .then(data => {
                if (data.success && data.config) {
                    applyMeetingMeta(data.config);
                }
            })
            .catch(() => { /* im lặng - banner/trống đồng chỉ là trang trí, không chặn dashboard */ });
    }

    // ============ FLASH ROLL-CALL: banner lần 2 tự đổi/tự khôi phục ============
    // Trạng thái được poll CHUNG nhịp với danh sách điểm danh (xem pollAttendance
    // bên dưới) — không cần thêm interval riêng, giữ tải nhẹ cho Apps Script.
    let rollCallActive = false;
    let rollCallExpiresAtDisplay = 0;
    let rollCallCountdownTimer = null;

    function applyRollCallFromConfig(rollCall) {
        if (rollCall && Date.now() <= rollCall.expiresAt) {
            showRollCallBanner(rollCall);
        } else if (rollCallActive) {
            restoreOriginalBanner();
        }
    }

    function showRollCallBanner(rollCall) {
        rollCallExpiresAtDisplay = rollCall.expiresAt;
        if (rollCallActive) {
            // Đã đang hiện banner lần 2 rồi (VD chỉ cập nhật lại thời hạn) —
            // không cần vẽ lại QR, chỉ cần đồng hồ đếm ngược tự chạy tiếp.
            return;
        }
        rollCallActive = true;

        const baseUrl = window.location.origin + window.location.pathname.replace(/display\.html$/, 'checkin-rollcall.html');
        const rollCallUrl = `${baseUrl}?id=${encodeURIComponent(meetingID)}&t=${encodeURIComponent(rollCall.token)}`;
        // QR PHÓNG TO để dễ quét từ xa trên màn LED lớn — kích thước ảnh nguồn
        // 720×720 (nét khi hiện ở 640px trong khung tham chiếu 1920×1080) và
        // ecc=M (chịu được mờ/nhiễu tốt hơn ecc=L, phù hợp khi QR hiện to và
        // đại biểu có thể quét từ khoảng cách xa hơn QR tĩnh lúc điểm danh lần 1).
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=720x720&ecc=M&data=${encodeURIComponent(rollCallUrl)}`;

        const wrap = document.getElementById('bannerContent');
        wrap.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:12px;">
                <div style="font-size:40px; font-weight:900; color:#E0512A; text-align:center;">⚡ ĐIỂM DANH LẦN 2 — ĐỀ NGHỊ QUÉT MÃ NGAY</div>
                <img src="${qrApiUrl}" alt="QR điểm danh lần 2" style="width:640px; height:640px; background:#fff; padding:16px; border-radius:20px;">
                <div id="rollCallDisplayCountdown" style="font-size:34px; font-weight:800; color:#E0512A;">còn --:--</div>
            </div>
        `;

        clearInterval(rollCallCountdownTimer);
        rollCallCountdownTimer = setInterval(tickRollCallDisplayCountdown, 1000);
        tickRollCallDisplayCountdown();
    }

    function tickRollCallDisplayCountdown() {
        const remainingMs = rollCallExpiresAtDisplay - Date.now();
        if (remainingMs <= 0) {
            restoreOriginalBanner();
            return;
        }
        const el = document.getElementById('rollCallDisplayCountdown');
        if (el) {
            const totalSec = Math.ceil(remainingMs / 1000);
            const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
            const ss = String(totalSec % 60).padStart(2, '0');
            el.textContent = 'còn ' + mm + ':' + ss;
        }
    }

    function restoreOriginalBanner() {
        rollCallActive = false;
        clearInterval(rollCallCountdownTimer);
        rollCallCountdownTimer = null;
        renderOriginalBanner();
    }

    function pollRollCallStatus() {
        if (!meetingID) return;
        callGASJsonp({ action: 'getRollCallStatus', meetingID: meetingID })
            .then(data => {
                if (data.success) {
                    applyRollCallFromConfig(data.active ? data.rollCall : null);
                }
            })
            .catch(() => { /* im lặng - không chặn dashboard nếu lỗi mạng tạm thời */ });
    }

    // ============ TỰ ẨN/HIỆN THANH DƯỚI ============
    // Bar mặc định ẩn xuống (chỉ lộ mép, bằng translateY — không chiếm chỗ
    // trong layout). Bất cứ khi nào có điểm danh MỚI, bar trồi lên ngay và
    // giữ nguyên 10s kể từ lượt điểm danh gần nhất; hết 10s không có gì mới
    // → tự ẩn xuống lại.
    // Banner nội dung (#layerBanner) CỐ ĐỊNH tuyệt đối theo mép màn hình,
    // không đổi theo bar (đã chừa sẵn padding-bottom cố định — xem CSS).
    // Khung viền trang trí (#layerFrame) thì NGƯỢC LẠI — phải tự nâng
    // "bottom" lên đúng bằng chiều cao bar mỗi khi bar trồi lên, để cạnh
    // dưới + 2 góc dưới của khung không bao giờ bị bar che mất. Class
    // .frame-avoid-bar (xem CSS #layerFrame.frame-avoid-bar) được bật/tắt
    // song song với .live trên bottomBar ngay tại đây.
    const BAR_AUTO_HIDE_MS = 10000;
    const bottomBarEl = document.getElementById('bottomBar');
    const layerFrameEl = document.getElementById('layerFrame');
    let barHideTimer = null;

    function showBottomBar() {
        bottomBarEl.classList.add('live');
        layerFrameEl.classList.add('frame-avoid-bar');
        clearTimeout(barHideTimer);
        barHideTimer = setTimeout(hideBottomBar, BAR_AUTO_HIDE_MS);
    }

    function hideBottomBar() {
        bottomBarEl.classList.remove('live');
        layerFrameEl.classList.remove('frame-avoid-bar');
    }

    // Trạng thái khởi đầu: ẩn (chưa có điểm danh nào để trồi lên vì).
    hideBottomBar();

    // ============ POLLING DANH SÁCH ĐIỂM DANH ============
    let knownKeys = new Set();
    let firstLoadDone = false;
    let toastQueue = [];
    let toastShowing = false;
    let marqueeQueue = []; // hàng đợi tên CHỜ chạy (mỗi tên chạy 1 lượt rồi bỏ)
    let marqueeRunning = false;

    function keyFor(person) {
        return (person.fullName || '') + '|' + (person.time || '') + '|' + (person.date || '') + '|' + (person.soLan || 1);
    }

    // fastPollUntil: mốc thời gian (Date.now()) mà TRƯỚC đó nhịp poll vẫn
    // đang ở chế độ "dồn dập" (FAST_POLL_INTERVAL_MS). Mỗi khi phát hiện có
    // người mới điểm danh, mốc này được đẩy xa thêm FAST_POLL_WINDOW_MS —
    // nên nhiều người bấm gửi liên tiếp sẽ giữ nhịp nhanh liên tục, không
    // chỉ 1 lần rồi rớt về chậm ngay.
    let fastPollUntil = 0;
    let pollTimer = null;

    function scheduleNextPoll(delayMs) {
        clearTimeout(pollTimer);
        pollTimer = setTimeout(pollAttendance, delayMs);
    }

    function pollAttendance() {
        if (!meetingID) return;
        // Poll trạng thái Flash Roll-Call CHUNG nhịp với điểm danh (không thêm
        // interval riêng) — banner lần 2 nhờ vậy tự đổi/tự khôi phục trong vòng
        // vài giây mà không cần thao tác gì thêm ở trang Admin hay F5 màn hình.
        pollRollCallStatus();
        callGASJsonp({ action: 'getAttendanceList', meetingID: meetingID })
            .then(data => {
                document.getElementById('connError').classList.remove('show');
                if (!data.success) {
                    scheduleNextPoll(POLL_INTERVAL_MS);
                    return;
                }
                const list = (data.list || []).map(sanitizePerson);
                updateDashboard(list);

                if (firstLoadDone) {
                    const newOnes = list.filter(p => !knownKeys.has(keyFor(p)));
                    if (newOnes.length) {
                        showBottomBar();
                        // Có điểm danh mới -> bật/gia hạn nhịp poll dồn dập để
                        // bắt kịp các lượt tiếp theo ngay, thay vì đợi tới hết
                        // chu kỳ chậm mới thấy tên xuất hiện trên màn hình.
                        fastPollUntil = Date.now() + FAST_POLL_WINDOW_MS;
                    }
                    newOnes.forEach(p => {
                        toastQueue.push(p);
                        marqueeQueue.push(p);
                    });
                    processToastQueue();
                    runMarqueeQueue();
                }
                // Lần tải đầu tiên: không dồn cả list cũ vào marquee (tránh
                // "hiện lại từ đầu" mỗi khi mở màn hình) — chỉ dashboard cần
                // có ngay dữ liệu, marquee sẽ chạy dần cho các lượt điểm danh
                // MỚI kể từ lúc này.
                knownKeys = new Set(list.map(keyFor));
                firstLoadDone = true;

                const nextDelay = Date.now() < fastPollUntil ? FAST_POLL_INTERVAL_MS : POLL_INTERVAL_MS;
                scheduleNextPoll(nextDelay);
            })
            .catch(() => {
                document.getElementById('connError').classList.add('show');
                scheduleNextPoll(POLL_INTERVAL_MS);
            });
    }

    // ============ VÙNG TRÁI: DASHBOARD ĐƠN VỊ (băng cuộn dọc) ============
    // Hiển thị TẤT CẢ đơn vị đã có người điểm danh (có thể hơn 100 đơn vị),
    // không giới hạn top-5 như trước — cuộn dọc liên tục để không bị khuất.
    let dashUnitsCount = 0;
    let hasAnyAttendance = false;
    function updateDashboard(list) {
        document.getElementById('totalCount').textContent = list.length;

        // Sửa lỗi: dòng "Đang chờ người tham dự điểm danh..." trước đây chỉ
        // được ẩn khi marquee đang chạy tên (runMarqueeQueue), nên nếu đã có
        // người điểm danh TRƯỚC KHI mở màn hình (hoặc sau khi F5 lại trang),
        // marqueeQueue rỗng (những người đó không còn là "mới" nữa) và dòng
        // chữ này bị kẹt hiển thị mãi dù đã có dữ liệu điểm danh thật. Nay
        // dựa thẳng vào tổng số người (list.length) để quyết định — hễ đã có
        // ít nhất 1 người thì luôn ẩn, không phụ thuộc trạng thái hàng đợi.
        hasAnyAttendance = list.length > 0;
        const marqueeEmptyEl = document.getElementById('marqueeEmpty');
        marqueeEmptyEl.textContent = hasAnyAttendance
            ? 'Đã điểm danh xong, chờ người tiếp theo...'
            : 'Đang chờ người tham dự điểm danh...';
        if (!marqueeRunning) {
            marqueeEmptyEl.style.display = hasAnyAttendance ? 'none' : '';
        }

        const byUnit = {};
        list.forEach(p => {
            const unit = (p.department || 'Chưa rõ đơn vị').trim() || 'Chưa rõ đơn vị';
            byUnit[unit] = (byUnit[unit] || 0) + 1;
        });
        const sorted = Object.entries(byUnit).sort((a, b) => b[1] - a[1]);
        document.getElementById('unitCountLbl').textContent = sorted.length + ' đơn vị';

        const track = document.getElementById('dashUnitsTrack');
        if (!sorted.length) {
            track.style.animation = 'none';
            track.innerHTML = '<div class="unit-row"><span class="u-name" style="color:var(--muted)">Chưa có dữ liệu</span></div>';
            return;
        }

        // Không cần vẽ lại / restart animation nếu số đơn vị không đổi kể từ
        // lần trước — tránh giật hình mỗi 6 giây khi poll (animation restart
        // sẽ làm băng cuộn nhảy về đầu liên tục, rất khó nhìn). Áp dụng cho
        // cả 2 trạng thái: đang cuộn (có 2 bộ) hoặc đang tĩnh (chỉ 1 bộ) —
        // số dòng thực tế trong track cho biết đang ở trạng thái nào.
        if (sorted.length === dashUnitsCount && track.children.length) {
            const rows = track.querySelectorAll('.unit-row');
            const isDoubled = rows.length === sorted.length * 2;
            const half = isDoubled ? sorted.length : 0;
            sorted.forEach(([unit, count], i) => {
                const countEl = rows[i] && rows[i].querySelector('.u-count');
                if (countEl) countEl.textContent = count;
                if (half) {
                    const countEl2 = rows[i + half] && rows[i + half].querySelector('.u-count');
                    if (countEl2) countEl2.textContent = count;
                }
            });
            return;
        }
        dashUnitsCount = sorted.length;

        const rowsHtml = sorted.map(([unit, count]) => `
            <div class="unit-row">
                <span class="u-name">${escapeHtml(unit)}</span>
                <span class="u-count">${count}</span>
            </div>
        `).join('');

        // Trước tiên render CHỈ 1 bộ (không nhân đôi) để đo chiều cao thật
        // (scrollHeight) so với vùng nhìn (clientHeight của khung cha) —
        // chỉ khi nội dung thực sự tràn khung mới nhân đôi + chạy animation
        // cuộn; nếu ít đơn vị (vừa khung nhìn), hiển thị tĩnh 1 lần duy nhất,
        // tránh cảnh "double" thấy 2 lần cùng lúc như trước.
        track.style.animation = 'none';
        track.innerHTML = rowsHtml;
        const viewport = track.parentElement; // khung nhìn cố định bao ngoài track
        const overflowing = track.scrollHeight > (viewport ? viewport.clientHeight : track.clientHeight) + 4;

        if (!overflowing) {
            // Vừa khung nhìn — giữ tĩnh, không nhân đôi, không animation.
            return;
        }

        // Nhân đôi nội dung để cuộn nửa track = đúng 1 vòng, liền mạch không
        // hụt khoảng trắng (giống kỹ thuật marquee ngang trước đây).
        track.innerHTML = rowsHtml + rowsHtml;

        // Tốc độ cuộn tỉ lệ theo số đơn vị — càng nhiều đơn vị, thời gian
        // 1 vòng càng dài, giữ tốc độ đọc (px/s) ổn định thay vì cuộn nhanh
        // dần khi danh sách dài ra.
        const approxDurationS = Math.max(14, sorted.length * 1.6);
        void track.offsetWidth; // reflow để restart animation
        track.style.animation = `dashScrollUp ${approxDurationS}s linear infinite`;
    }

    // ============ VÙNG GIỮA: MARQUEE — MỖI TÊN CHẠY 1 LƯỢT RỒI BIẾN MẤT ====
    const MARQUEE_ITEM_DURATION_MS = 9500; // thời gian 1 tên chạy hết khung (~9-10s theo yêu cầu)
    const MARQUEE_GAP_MS = 900; // khoảng nghỉ giữa 2 tên để không chồng chữ

    function runMarqueeQueue() {
        if (marqueeRunning || !marqueeQueue.length) return;
        marqueeRunning = true;
        document.getElementById('marqueeEmpty').style.display = 'none';
        playNextMarqueeItem();
    }

    function playNextMarqueeItem() {
        if (!marqueeQueue.length) {
            marqueeRunning = false;
            // Text/trạng thái hiện hay ẩn của dòng "Đang chờ..." / "Đã điểm
            // danh xong..." đã được updateDashboard() (chạy mỗi lần poll) set
            // đúng theo hasAnyAttendance rồi — ở đây chỉ cần hiện lại nó khi
            // hàng đợi marquee đã chạy hết (dù đang ở nội dung nào), không tự
            // ý ép về text rỗng/mặc định nữa.
            document.getElementById('marqueeEmpty').style.display = '';
            return;
        }
        const p = marqueeQueue.shift();
        const track = document.getElementById('marqueeTrack');

        const metaParts = [];
        if (p.position) metaParts.push(p.position);
        if (p.department) metaParts.push(p.department);
        const meta = metaParts.join(' • ');

        const el = document.createElement('span');
        el.className = 'marquee-item';
        el.style.animationDuration = MARQUEE_ITEM_DURATION_MS + 'ms';
        el.innerHTML = `✓ ${escapeHtml(p.fullName || 'Đại biểu')}${meta ? `<span class="m-meta">${escapeHtml(meta)}</span>` : ''}`;
        track.appendChild(el);

        el.addEventListener('animationend', () => {
            el.remove();
        }, { once: true });

        // Lượt tiếp theo bắt đầu sau một khoảng nghỉ ngắn, không đợi hết hẳn
        // animation trước để nhiều người điểm danh liên tiếp vẫn chạy nối
        // đuôi nhau mượt thay vì dồn cục.
        setTimeout(playNextMarqueeItem, MARQUEE_GAP_MS);
    }

    // ============ VÙNG PHẢI: POPUP TÊN VỪA ĐIỂM DANH ============
    function processToastQueue() {
        if (toastShowing || !toastQueue.length) return;
        toastShowing = true;
        const person = toastQueue.shift();
        const toast = document.getElementById('checkinToast');
        const idle = document.getElementById('toastZoneIdle');

        document.getElementById('toastName').textContent = person.fullName || 'Đại biểu';
        const metaParts = [];
        if (person.position) metaParts.push(person.position);
        if (person.department) metaParts.push(person.department);
        document.getElementById('toastMeta').textContent = metaParts.join(' • ') || (person.time || '');

        idle.style.display = 'none';
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => {
                idle.style.display = 'block';
                toastShowing = false;
                processToastQueue();
            }, 400);
        }, TOAST_DURATION_MS);
    }

    // ============ KHỞI ĐỘNG ============
    if (!meetingID) {
        const wrap = document.getElementById('bannerContent');
        wrap.innerHTML =
            '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 90px;text-shadow:0 2px 18px rgba(0,0,0,0.55);">' +
            '<div style="font-size:44px;font-weight:800;">⚠️ Thiếu mã cuộc họp</div>' +
            '<div style="font-size:20px;font-weight:500;margin-top:14px;">Mở trang này kèm ?id=MÃ_CUỘC_HỌP trong URL.<br>Vào trang Admin, lưu cấu hình rồi bấm nút "Mở Màn Hình Chiếu" để lấy đúng link.</div>' +
            '</div>';
    } else {
        loadMeetingConfig();
        scheduleNextPoll(0);
    }
</script>
